[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arabic-fact-checker"
version = "0.1.0"
description = "Evidence-based Arabic fact checking without generative LLMs"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.6,<3",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6.0,<7",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=24.4,<26",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
ml = [
  "accelerate>=1.2,<2",
  "datasets>=3.2,<4",
  "evaluate>=0.4,<1",
  "faiss-cpu>=1.9,<2",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=3.3,<4",
  "torch>=2.4,<3",
  "transformers>=4.47,<5",
]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
]
search = ["ddgs>=9,<10"]

[tool.hatch.build.targets.wheel]
packages = ["app", "training", "evaluation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "datasets",
  "ddgs",
  "dateutil",
  "dateutil.*",
  "numpy",
  "sklearn",
  "sklearn.*",
  "faiss",
  "sentence_transformers",
  "torch",
  "torch.*",
  "transformers",
  "yaml",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app", "training", "evaluation"]
